name: CI y Deploy

# Build + type-check en cada push y PR. Deploy a Netlify al integrar en main
# (o manualmente desde la pestaña Actions con "Run workflow").

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build y type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Guardar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5

  deploy:
    name: Deploy a Netlify
    runs-on: ubuntu-latest
    needs: build
    # Solo despliega en la rama principal o a pedido, no en cada PR.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publicar en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: '3831feb3-951b-41f3-a9ff-7009d110b2b0'
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Falta el secret NETLIFY_AUTH_TOKEN. Agregalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes netlify-cli@17 deploy \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod \
            --message "Deploy desde GitHub Actions (${{ github.sha }})"
