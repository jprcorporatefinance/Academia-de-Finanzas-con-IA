name: CI

# Build + type-check en cada push y PR.
#
# El deploy ya NO se hace desde acá: Netlify está conectado directo al repo
# (Git-based continuous deployment) y publica automáticamente en cada push a
# main usando la configuración de netlify.toml. Por eso este workflow no
# necesita el secret NETLIFY_AUTH_TOKEN.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build y type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Guardar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5
